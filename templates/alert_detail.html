{% extends "base.html" %}
{% block title %}Dettaglio alert · {{ APP_NAME }}{% endblock %}
{% block content %}
<a href="/alerts" class="small text-decoration-none">← I miei alert</a>
<div id="alertHead" class="mt-2 mb-3"></div>

<div id="offerTools" class="d-flex align-items-center gap-2 mb-2" hidden>
  <label class="small text-muted mb-0" for="offerSort">Ordina per</label>
  <select id="offerSort" class="form-select form-select-sm w-auto">
    <option value="price">Prezzo</option>
    <option value="date">Data di partenza</option>
    <option value="name">Destinazione (A–Z)</option>
  </select>
</div>
<div id="offerStatus" class="text-muted small mb-3">Caricamento…</div>
<div id="offersList" class="row g-3"></div>
{% endblock %}
{% block scripts %}<script>window.__PAGE__ = "alert_detail"; window.__ALERT_ID__ = {{ alert_id|tojson }};</script>{% endblock %}
